<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Woordjes oefenen</title>
<style>
  :root {
    --bg: #f4f6fb;
    --card-bg: #ffffff;
    --text: #1f2430;
    --muted: #6b7280;
    --accent: #3b6df0;
    --accent-dark: #2851c9;
    --good: #1f9d55;
    --good-bg: #e6f8ed;
    --bad: #d1372e;
    --bad-bg: #fdeceb;
    --border: #e2e5ec;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 16px;
    box-shadow: 0 10px 30px rgba(20, 30, 60, 0.06);
    padding: 36px;
    width: 100%;
    max-width: 560px;
  }
  h1 {
    margin: 0 0 8px;
    font-size: 1.5rem;
  }
  p.subtitle {
    margin: 0 0 28px;
    color: var(--muted);
    line-height: 1.5;
  }
  .hint-icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 20px;
    height: 20px;
    margin-left: 8px;
    border-radius: 50%;
    background: var(--border);
    color: var(--muted);
    font-size: 0.8rem;
    font-weight: 700;
    cursor: help;
    vertical-align: middle;
  }
  .file-label {
    display: inline-block;
    background: var(--accent);
    color: #fff;
    padding: 12px 20px;
    border-radius: 10px;
    cursor: pointer;
    font-weight: 600;
    font-size: 0.95rem;
    transition: background 0.15s ease;
  }
  .file-label:hover { background: var(--accent-dark); }
  input[type="file"] { display: none; }
  .warning {
    margin-top: 16px;
    background: var(--bad-bg);
    color: var(--bad);
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 0.9rem;
    line-height: 1.4;
  }
  .resume-banner {
    margin-bottom: 20px;
    background: #f0f3fb;
    border: 1px solid #d3ddf7;
    border-radius: 10px;
    padding: 14px 16px;
  }
  .resume-info {
    font-size: 0.9rem;
    line-height: 1.4;
    margin-bottom: 10px;
  }
  .resume-actions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .resume-actions button {
    flex: 0 1 auto;
    font-size: 0.85rem;
    padding: 8px 14px;
  }
  .btn-resume { background: var(--accent); color: #fff; }
  .btn-dismiss-resume { background: #fff; color: var(--accent-dark); border: 1.5px solid #d3ddf7; }
  .progress {
    color: var(--muted);
    font-size: 0.9rem;
    margin-bottom: 10px;
    display: flex;
    justify-content: space-between;
  }
  .prompt {
    display: flex;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
    gap: 12px;
    font-size: 2rem;
    font-weight: 700;
    text-align: center;
    padding: 28px 12px;
    margin: 10px 0 24px;
    background: #f0f3fb;
    border-radius: 12px;
    word-break: break-word;
  }
  .prompt-text { word-break: break-word; }
  .btn-speak {
    flex: 0 0 auto;
    width: 40px;
    height: 40px;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--accent);
    color: #fff;
    border-radius: 50%;
  }
  .btn-speak svg { width: 20px; height: 20px; }
  input[type="text"] {
    width: 100%;
    font-size: 1.1rem;
    padding: 14px 16px;
    border-radius: 10px;
    border: 2px solid var(--border);
    outline: none;
    transition: border-color 0.15s ease;
  }
  input[type="text"]:focus { border-color: var(--accent); }
  input[type="text"]:disabled { background: #f7f8fb; color: var(--muted); }
  .buttons {
    display: flex;
    gap: 10px;
    margin-top: 18px;
    flex-wrap: wrap;
  }
  button {
    font-family: inherit;
    font-size: 0.95rem;
    font-weight: 600;
    border: none;
    border-radius: 10px;
    padding: 12px 16px;
    cursor: pointer;
    transition: filter 0.1s ease, opacity 0.1s ease;
    flex: 1 1 auto;
  }
  button:disabled { opacity: 0.5; cursor: default; }
  button:not(:disabled):hover { filter: brightness(1.08); }
  .btn-check { background: var(--accent); color: #fff; }
  .btn-know { background: #e7edfc; color: var(--accent-dark); }
  .btn-dontknow { background: #f3f4f6; color: #4b5563; }
  .btn-next { background: var(--text); color: #fff; width: 100%; margin-top: 16px; }
  .end-actions {
    margin-top: 20px;
  }
  .primary-cta-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .btn-primary-cta {
    width: auto;
    flex: 1 1 auto;
    background: var(--accent);
    color: #fff;
    font-size: 1.05rem;
    padding: 16px;
  }
  .info-icon {
    flex: 0 0 auto;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: #e5e7eb;
    color: var(--muted);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.8rem;
    font-weight: 700;
    cursor: help;
    user-select: none;
  }
  .secondary-actions {
    display: flex;
    gap: 10px;
    margin-top: 16px;
    flex-wrap: wrap;
  }
  .btn-mistakes { background: #e7edfc; color: var(--accent-dark); }
  .btn-all { background: #fff; color: var(--accent-dark); border: 1.5px solid #d3ddf7; }
  .btn-newsession-link {
    display: block;
    width: 100%;
    background: none;
    color: var(--muted);
    text-decoration: underline;
    font-weight: 600;
    font-size: 0.9rem;
    padding: 6px 0;
    margin-top: 18px;
    text-align: center;
  }
  .btn-newsession-link:hover { background: none; filter: none; color: var(--text); }
  .feedback {
    margin-top: 18px;
    padding: 14px 16px;
    border-radius: 10px;
    font-size: 1rem;
    line-height: 1.5;
    display: none;
  }
  .feedback.good { display: block; background: var(--good-bg); color: var(--good); }
  .feedback.bad { display: block; background: var(--bad-bg); color: var(--bad); }
  .feedback b { font-weight: 700; }
  .score-line {
    font-size: 1.3rem;
    font-weight: 700;
    text-align: center;
    margin-bottom: 18px;
  }
  .histogram {
    margin: 4px 0 8px;
  }
  .histogram-bars {
    display: flex;
    align-items: flex-end;
    gap: 6px;
    height: 80px;
  }
  .histogram-col {
    flex: 1 1 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    height: 100%;
  }
  .histogram-count {
    font-size: 0.75rem;
    color: var(--muted);
    margin-bottom: 2px;
  }
  .histogram-bar {
    width: 100%;
    border-radius: 4px 4px 0 0;
    min-height: 2px;
  }
  .histogram-label {
    font-size: 0.75rem;
    color: var(--muted);
    margin-top: 4px;
  }
  .mistakes-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin: 18px 0 8px;
  }
  .mistakes-title {
    font-weight: 700;
  }
  .btn-toggle-answers {
    flex: 0 0 auto;
    background: none;
    color: var(--accent);
    padding: 4px 0;
    font-size: 0.85rem;
    text-decoration: underline;
  }
  .btn-toggle-answers:hover { background: none; filter: none; color: var(--accent-dark); }
  .skip-wrap {
    display: flex;
    justify-content: center;
    margin-top: 10px;
  }
  .btn-skip {
    flex: 0 0 auto;
    background: none;
    color: var(--muted);
    padding: 4px 8px;
    font-size: 0.85rem;
    text-decoration: underline;
    font-weight: 600;
  }
  .btn-skip:hover { background: none; filter: none; color: var(--text); }
  .mistake-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
    gap: 16px;
  }
  .mistake-row:last-child { border-bottom: none; }
  .mistake-fr-wrap { display: flex; align-items: baseline; gap: 8px; }
  .mistake-cross { color: var(--bad); font-weight: 700; }
  .mistake-fr { color: var(--text); }
  .mistake-nl { color: var(--muted); text-align: right; }
  .no-mistakes {
    text-align: center;
    color: var(--good);
    font-weight: 600;
    padding: 10px 0;
  }
  .hidden { display: none !important; }
  .file-list {
    margin-top: 14px;
    font-size: 0.9rem;
    color: var(--muted);
  }
  .loaded-file-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 4px 0;
  }
  .btn-remove-file {
    flex: 0 0 auto;
    width: 22px;
    height: 22px;
    padding: 0;
    border-radius: 50%;
    background: var(--bad-bg);
    color: var(--bad);
    font-weight: 700;
    line-height: 1;
    font-size: 0.85rem;
  }
  .loaded-file-name {
    color: var(--text);
  }
  .settings {
    margin-top: 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .setting-label {
    font-weight: 700;
    font-size: 0.9rem;
    margin-bottom: 6px;
  }
  .setting-options {
    display: flex;
    flex-wrap: wrap;
    gap: 6px 18px;
    font-size: 0.9rem;
    color: var(--text);
  }
  .setting-options label {
    display: flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
  }
</style>
</head>
<body>

<div class="card" id="card">

  <!-- Startscherm: bestand(en) kiezen -->
  <div id="screen-start">
    <h1>Woordjes oefenen</h1>
    <p class="subtitle">Kies één of meerdere lesbestanden (.yaml) om woorden te oefenen, van elke vreemde taal naar het Nederlands en andersom.</p>
    <div class="resume-banner hidden" id="resume-banner">
      <div class="resume-info" id="resume-info"></div>
      <div class="resume-actions">
        <button class="btn-resume" id="btn-resume" type="button">Doorgaan</button>
        <button class="btn-dismiss-resume" id="btn-clear-progress" type="button">Start nieuwe sessie</button>
      </div>
    </div>
    <label class="file-label" for="file-input" id="file-label">Kies lesbestand(en)</label>
    <span class="hint-icon" tabindex="0" title="Tip: je browser onthoudt meestal de laatst gebruikte map. Navigeer de eerste keer handmatig naar de map met je lesbestanden (bv. fr/ of en/) — daarna opent de bestandskiezer daar vaak vanzelf weer.">?</span>
    <input type="file" id="file-input" accept=".yaml,.yml" multiple>
    <div class="file-list" id="file-list"></div>
    <div class="warning hidden" id="start-warning"></div>
    <div class="settings">
      <div class="setting-group">
        <div class="setting-label">Richting</div>
        <div class="setting-options">
          <label><input type="radio" name="direction" value="fwd" checked> Vreemde taal &rarr; Nederlands</label>
          <label><input type="radio" name="direction" value="rev"> Nederlands &rarr; Vreemde taal</label>
        </div>
      </div>
      <div class="setting-group">
        <div class="setting-label">Automatisch voorlezen</div>
        <div class="setting-options">
          <label><input type="radio" name="sound-mode" value="off" checked> Uit</label>
          <label><input type="radio" name="sound-mode" value="foreign"> Vreemde taal</label>
          <label><input type="radio" name="sound-mode" value="both"> Beide talen</label>
        </div>
      </div>
      <div class="setting-group">
        <div class="setting-label">Volgorde</div>
        <div class="setting-options">
          <label><input type="radio" name="order-mode" value="random" checked> Willekeurige volgorde</label>
          <label><input type="radio" name="order-mode" value="original"> Originele volgorde</label>
        </div>
      </div>
    </div>
  </div>

  <!-- Quiz-scherm -->
  <div id="screen-quiz" class="hidden">
    <div class="progress">
      <span id="progress-text"></span>
      <span id="score-text"></span>
    </div>
    <div class="prompt">
      <span class="prompt-text" id="prompt-text"></span>
      <button class="btn-speak hidden" id="btn-speak" type="button" aria-label="Uitspraak beluisteren" title="Uitspraak beluisteren">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M12 14a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v5a3 3 0 0 0 3 3z"/>
          <path d="M19 11a1 1 0 0 0-2 0 5 5 0 0 1-10 0 1 1 0 0 0-2 0 7 7 0 0 0 6 6.92V20H9a1 1 0 0 0 0 2h6a1 1 0 0 0 0-2h-2v-2.08A7 7 0 0 0 19 11z"/>
        </svg>
      </button>
    </div>
    <input type="text" id="answer-input" autocomplete="off" placeholder="Typ de Nederlandse vertaling...">
    <div class="buttons">
      <button class="btn-check" id="btn-check">Check</button>
      <button class="btn-know" id="btn-know">Weet ik</button>
      <button class="btn-dontknow" id="btn-dontknow">Weet ik niet</button>
    </div>
    <div class="skip-wrap">
      <button class="btn-skip" id="btn-skip" type="button">Sla over</button>
    </div>
    <button class="btn-newsession-link" id="btn-new-session-quiz" type="button">Nieuwe sessie</button>
    <div class="feedback" id="feedback"></div>
    <button class="btn-next hidden" id="btn-next">Volgende &rarr;</button>
  </div>

  <!-- Eindscherm -->
  <div id="screen-end" class="hidden">
    <div class="score-line" id="final-score"></div>
    <div class="histogram" id="stats-histogram"></div>
    <div class="mistakes-header">
      <div class="mistakes-title" id="mistakes-title"></div>
      <button class="btn-toggle-answers hidden" id="btn-toggle-answers">Toon antwoorden</button>
    </div>
    <div id="mistakes-list"></div>
    <div class="end-actions">
      <div class="primary-cta-row">
        <button class="btn-primary-cta" id="btn-smart-practice" type="button">Slim oefenen</button>
        <span class="info-icon" tabindex="0" title="Korte ronde van maximaal 30 woorden: al je foute woorden, aangevuld met woorden die je minder vaak goed had. Nooit meer geleerde dan ongeleerde woorden.">?</span>
      </div>

      <div class="secondary-actions">
        <button class="btn-mistakes" id="btn-practice-mistakes">Oefen foute woorden</button>
        <button class="btn-all" id="btn-practice-all">Oefen alle woorden</button>
      </div>

      <button class="btn-newsession-link" id="btn-new-session" type="button">Nieuwe sessie</button>
    </div>
  </div>

</div>

<script>
(function () {
  "use strict";

  // ---------- Elements ----------
  const screenStart = document.getElementById("screen-start");
  const screenQuiz = document.getElementById("screen-quiz");
  const screenEnd = document.getElementById("screen-end");

  const fileInput = document.getElementById("file-input");
  const fileLabelEl = document.getElementById("file-label");
  const fileListEl = document.getElementById("file-list");
  const startWarning = document.getElementById("start-warning");

  const progressText = document.getElementById("progress-text");
  const scoreText = document.getElementById("score-text");
  const promptText = document.getElementById("prompt-text");
  const btnSpeak = document.getElementById("btn-speak");
  const answerInput = document.getElementById("answer-input");
  const btnCheck = document.getElementById("btn-check");
  const btnKnow = document.getElementById("btn-know");
  const btnDontKnow = document.getElementById("btn-dontknow");
  const btnSkip = document.getElementById("btn-skip");
  const btnNext = document.getElementById("btn-next");
  const feedbackEl = document.getElementById("feedback");

  const finalScoreEl = document.getElementById("final-score");
  const mistakesTitle = document.getElementById("mistakes-title");
  const mistakesList = document.getElementById("mistakes-list");
  const histogramEl = document.getElementById("stats-histogram");
  const btnToggleAnswers = document.getElementById("btn-toggle-answers");
  const btnSmartPractice = document.getElementById("btn-smart-practice");
  const btnPracticeMistakes = document.getElementById("btn-practice-mistakes");
  const btnPracticeAll = document.getElementById("btn-practice-all");
  const btnNewSession = document.getElementById("btn-new-session");
  const btnNewSessionQuiz = document.getElementById("btn-new-session-quiz");
  const resumeBanner = document.getElementById("resume-banner");
  const resumeInfo = document.getElementById("resume-info");
  const btnResume = document.getElementById("btn-resume");
  const btnClearProgress = document.getElementById("btn-clear-progress");

  // ---------- State ----------
  let playlist = [];
  let currentIndex = 0;
  let score = 0;
  let mistakes = [];
  let skipped = 0;
  let answered = false;
  let answersRevealed = false;
  let direction = "fwd";
  let soundMode = "off";
  let wordStats = new Map(); // item -> { fwd, rev } streaks, per richting

  // ---------- Voortgang opslaan (localStorage) ----------
  const STORAGE_KEY = "woordjesleren:progress:v1";
  let storedMeta = {}; // { fileNames, lastRound } - aangevuld via persistState()
  let pendingResume = null; // gevulde staat uit localStorage, klaar om te hervatten

  function setDirectionRadio(value) {
    const el = document.querySelector(`input[name="direction"][value="${value}"]`);
    if (el) el.checked = true;
  }

  function setSoundModeRadio(value) {
    const el = document.querySelector(`input[name="sound-mode"][value="${value}"]`);
    if (el) el.checked = true;
  }

  function setOrderModeRadio(value) {
    const el = document.querySelector(`input[name="order-mode"][value="${value}"]`);
    if (el) el.checked = true;
  }

  function itemKey(item) {
    return `${item.lang}|${item.word}|${item.nl}`;
  }

  function tagLegacyItemsWithSingleFile(items, fileNames) {
    if (!fileNames || fileNames.length !== 1) return;
    const onlyName = fileNames[0];
    for (const item of items) {
      if (!item.file) item.file = onlyName;
    }
  }

  function normalizeLastRound(raw) {
    if (raw && typeof raw === "object" && ("fwd" in raw || "rev" in raw)) {
      return { fwd: raw.fwd || null, rev: raw.rev || null };
    }
    return { fwd: null, rev: null };
  }

  function rebuildWordStats(items, entries) {
    const lookup = new Map();
    for (const item of items) lookup.set(itemKey(item), item);
    const map = new Map();
    for (const entry of entries || []) {
      if (entry.length < 3) continue; // oud formaat (los getal) - statistieken resetten
      const [key, fwd, rev] = entry;
      const item = lookup.get(key);
      if (item) map.set(item, { fwd: fwd || 0, rev: rev || 0 });
    }
    return map;
  }

  function resetCurrentDirectionStats() {
    for (const [item, entry] of wordStats.entries()) {
      delete entry[direction];
      if (!entry.fwd && !entry.rev) wordStats.delete(item);
    }
    storedMeta.lastRound = { ...normalizeLastRound(storedMeta.lastRound), [direction]: null };
  }

  function loadStoredState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return null;
      const data = JSON.parse(raw);
      if (!data || !Array.isArray(data.words) || !Array.isArray(data.sentences)) return null;
      return data;
    } catch (err) {
      return null;
    }
  }

  function persistState(patch) {
    try {
      Object.assign(storedMeta, patch);
      const data = {
        fileNames: storedMeta.fileNames || [],
        lastRound: normalizeLastRound(storedMeta.lastRound),
        direction: direction,
        soundMode: getSoundMode(),
        orderMode: getOrderMode(),
        words: combinedWords,
        sentences: combinedSentences,
        wordStats: Array.from(wordStats.entries()).map(([item, v]) => [itemKey(item), v.fwd || 0, v.rev || 0]),
      };
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    } catch (err) {
      // Opslag niet beschikbaar (privémodus, quota) - app werkt gewoon verder zonder persistentie.
    }
  }

  function formatRelativeTime(timestamp) {
    const diffMs = Date.now() - timestamp;
    const minutes = Math.round(diffMs / 60000);
    if (minutes < 1) return "zojuist";
    if (minutes < 60) return `${minutes} min geleden`;
    const hours = Math.round(minutes / 60);
    if (hours < 24) return `${hours} uur geleden`;
    const days = Math.round(hours / 24);
    return `${days} dag${days === 1 ? "" : "en"} geleden`;
  }

  function refreshResumeBanner() {
    const stored = loadStoredState();
    if (stored && stored.direction) {
      setDirectionRadio(stored.direction);
    }
    if (stored && stored.soundMode) {
      setSoundModeRadio(stored.soundMode);
    }
    if (stored && stored.orderMode) {
      setOrderModeRadio(stored.orderMode);
    }
    if (!stored || stored.words.length + stored.sentences.length === 0) {
      pendingResume = null;
      resumeBanner.classList.add("hidden");
      return;
    }

    pendingResume = stored;
    const fileText = stored.fileNames && stored.fileNames.length
      ? stored.fileNames.join(", ")
      : "eerdere lesbestanden";
    const roundForDirection = normalizeLastRound(stored.lastRound)[getDirection()];
    const hasProgress = Array.isArray(stored.wordStats) && stored.wordStats.length > 0;
    const roundText = roundForDirection
      ? `${roundForDirection.score}/${roundForDirection.total} goed, ${formatRelativeTime(roundForDirection.at)}`
      : "nog niet geoefend";
    resumeInfo.textContent = `${fileText} — ${roundText}`;
    btnResume.classList.toggle("hidden", !roundForDirection && !hasProgress);
    resumeBanner.classList.remove("hidden");
  }

  // ---------- Tiny YAML parser (tailored to the lesson file format) ----------
  // Expected shape (taal-key is vrij, bepaalt de taal van het lesbestand):
  // lesson: N
  // words:
  //   - fr: ...   (of en:, de:, ...)
  //     nl: ...
  // sentences:
  //   - fr: ...
  //     nl: ...
  function parseLessonYaml(text) {
    const lines = text.split(/\r?\n/);
    const result = { words: [], sentences: [] };
    let section = null; // "words" | "sentences" | null
    let current = null; // item currently being filled

    function stripValue(raw) {
      let v = raw.trim();
      if (
        v.length >= 2 &&
        ((v[0] === '"' && v[v.length - 1] === '"') ||
          (v[0] === "'" && v[v.length - 1] === "'"))
      ) {
        v = v.slice(1, -1);
      }
      return v;
    }

    for (const rawLine of lines) {
      const line = rawLine.replace(/\t/g, "  ");
      const trimmed = line.trim();
      if (!trimmed || trimmed.startsWith("#")) continue;

      if (/^words\s*:/.test(trimmed)) {
        section = "words";
        current = null;
        continue;
      }
      if (/^sentences\s*:/.test(trimmed)) {
        section = "sentences";
        current = null;
        continue;
      }
      if (/^lesson\s*:/.test(trimmed)) {
        continue;
      }

      if (!section) continue;

      const itemStart = trimmed.match(/^-\s*([a-z]{2,3})\s*:\s*(.*)$/);
      if (itemStart) {
        current = { word: stripValue(itemStart[2]), nl: "", lang: itemStart[1] };
        result[section].push(current);
        continue;
      }

      const nlMatch = trimmed.match(/^nl\s*:\s*(.*)$/);
      if (nlMatch && current) {
        current.nl = stripValue(nlMatch[1]);
        continue;
      }
    }

    return result;
  }

  function isValidLessonData(data) {
    return (
      data &&
      Array.isArray(data.words) &&
      Array.isArray(data.sentences) &&
      (data.words.length > 0 || data.sentences.length > 0) &&
      data.words.every((w) => w.word && w.nl && w.lang) &&
      data.sentences.every((s) => s.word && s.nl && s.lang)
    );
  }

  // ---------- File handling ----------
  let combinedWords = [];
  let combinedSentences = [];

  function renderFileList() {
    const names = storedMeta.fileNames || [];
    fileLabelEl.textContent = names.length ? "Voeg lesbestand(en) toe" : "Kies lesbestand(en)";
    fileListEl.innerHTML = names
      .map((name) => `<div class="loaded-file-row" data-file="${escapeHtml(name)}">
        <button class="btn-remove-file" type="button" aria-label="Verwijder ${escapeHtml(name)}">&times;</button>
        <span class="loaded-file-name">${escapeHtml(name)}</span>
      </div>`)
      .join("");
  }

  function removeFile(fileName) {
    const keep = (item) => {
      if (item.file !== fileName) return true;
      wordStats.delete(item);
      return false;
    };
    combinedWords = combinedWords.filter(keep);
    combinedSentences = combinedSentences.filter(keep);
    storedMeta.fileNames = (storedMeta.fileNames || []).filter((n) => n !== fileName);
    renderFileList();
    persistState({ fileNames: storedMeta.fileNames, lastRound: { fwd: null, rev: null } });
    refreshResumeBanner();
  }

  fileListEl.addEventListener("click", (e) => {
    const btn = e.target.closest(".btn-remove-file");
    if (!btn) return;
    const row = btn.closest(".loaded-file-row");
    if (row) removeFile(row.dataset.file);
  });

  fileInput.addEventListener("change", async () => {
    const files = Array.from(fileInput.files || []);
    if (files.length === 0) return;

    const warnings = [];
    const addedNames = [];
    const existingNames = new Set(storedMeta.fileNames || []);

    for (const file of files) {
      if (existingNames.has(file.name)) {
        warnings.push(`"${file.name}" is al geladen en wordt overgeslagen.`);
        continue;
      }
      try {
        const text = await file.text();
        const data = parseLessonYaml(text);
        if (!isValidLessonData(data)) {
          warnings.push(`"${file.name}" heeft niet het verwachte formaat en is overgeslagen.`);
          continue;
        }
        data.words.forEach((w) => { w.file = file.name; });
        data.sentences.forEach((s) => { s.file = file.name; });
        combinedWords = combinedWords.concat(data.words);
        combinedSentences = combinedSentences.concat(data.sentences);
        existingNames.add(file.name);
        addedNames.push(file.name);
      } catch (err) {
        warnings.push(`"${file.name}" kon niet gelezen worden en is overgeslagen.`);
      }
    }

    fileInput.value = "";

    if (warnings.length) {
      startWarning.textContent = warnings.join(" ");
      startWarning.classList.remove("hidden");
    } else {
      startWarning.classList.add("hidden");
    }

    if (addedNames.length) {
      const fileNames = (storedMeta.fileNames || []).concat(addedNames);
      persistState({ fileNames, lastRound: { fwd: null, rev: null } });
      renderFileList();
      refreshResumeBanner();
    }
  });

  // ---------- Quiz setup ----------
  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function getOrderMode() {
    const el = document.querySelector('input[name="order-mode"]:checked');
    return el ? el.value : "random";
  }

  function buildPlaylist(words, sentences) {
    if (getOrderMode() === "original") return words.concat(sentences);
    return shuffle(words).concat(shuffle(sentences));
  }

  function startQuiz(words, sentences) {
    beginSession(buildPlaylist(words, sentences));
  }

  function startMistakesQuiz() {
    const items = getOrderMode() === "original" ? mistakes.slice() : shuffle(mistakes);
    beginSession(items);
  }

  function getDirection() {
    const el = document.querySelector('input[name="direction"]:checked');
    return el ? el.value : "fwd";
  }

  function getSoundMode() {
    const el = document.querySelector('input[name="sound-mode"]:checked');
    return el ? el.value : "off";
  }

  function promptWord(item) {
    return direction === "rev" ? item.nl : item.word;
  }

  function promptLang(item) {
    return direction === "rev" ? "nl" : item.lang;
  }

  function answerWord(item) {
    return direction === "rev" ? item.word : item.nl;
  }

  function answerLang(item) {
    return direction === "rev" ? item.lang : "nl";
  }

  function beginSession(items, directionOverride) {
    playlist = items;
    currentIndex = 0;
    score = 0;
    mistakes = [];
    skipped = 0;
    direction = directionOverride || getDirection();
    soundMode = getSoundMode();

    screenStart.classList.add("hidden");
    screenEnd.classList.add("hidden");
    screenQuiz.classList.remove("hidden");

    showCurrentItem();
  }

  function currentItem() {
    return playlist[currentIndex];
  }

  function showCurrentItem() {
    answered = false;
    const item = currentItem();
    progressText.textContent = `Woord ${currentIndex + 1} van ${playlist.length}`;
    scoreText.textContent = `Score: ${score}`;
    promptText.textContent = promptWord(item);
    answerInput.value = "";
    answerInput.disabled = false;
    btnCheck.disabled = false;
    btnKnow.disabled = false;
    btnDontKnow.disabled = false;
    btnSkip.disabled = false;
    feedbackEl.className = "feedback";
    feedbackEl.textContent = "";
    btnNext.classList.add("hidden");
    answerInput.focus();

    if (soundMode !== "off") {
      const lang = promptLang(item);
      if (soundMode === "both" || (soundMode === "foreign" && lang !== "nl")) {
        speak(promptWord(item), lang);
      }
    }
  }

  // ---------- Answer checking ----------
  function stripDiacritics(s) {
    return s.normalize("NFD").replace(/[̀-ͯ]/g, "");
  }

  function normalize(s) {
    return stripDiacritics(s.toLowerCase())
      .trim()
      .replace(/[.?!]+$/g, "")
      .replace(/\s+/g, " ")
      .trim();
  }

  function isCorrectAnswer(userInput, correctAnswer) {
    const normalizedInput = normalize(userInput);
    if (!normalizedInput) return false;
    const alternatives = correctAnswer.split(",").map(normalize);
    return alternatives.includes(normalizedInput);
  }

  // ---------- Uitspraak (Web Speech API) ----------
  const speechSupported = "speechSynthesis" in window;
  if (speechSupported) {
    btnSpeak.classList.remove("hidden");
  }

  const LANG_TAGS = { fr: "fr-FR", en: "en-US", nl: "nl-NL", de: "de-DE", es: "es-ES", it: "it-IT" };
  function toBcp47(lang) {
    return LANG_TAGS[lang] || lang;
  }

  function pickVoiceForLang(tag) {
    const voices = window.speechSynthesis.getVoices();
    const prefix = tag.slice(0, 2).toLowerCase();
    return voices.find((v) => v.lang && v.lang.toLowerCase().startsWith(prefix)) || null;
  }

  function speak(text, lang) {
    if (!speechSupported || !text) return;
    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(text);
    const tag = toBcp47(lang);
    utterance.lang = tag;
    const voice = pickVoiceForLang(tag);
    if (voice) utterance.voice = voice;
    window.speechSynthesis.speak(utterance);
  }

  btnSpeak.addEventListener("click", () => {
    const item = currentItem();
    if (item) speak(promptWord(item), promptLang(item));
  });

  // ---------- Answer handling ----------
  function markAnswered() {
    answered = true;
    answerInput.disabled = true;
    btnCheck.disabled = true;
    btnKnow.disabled = true;
    btnDontKnow.disabled = true;
    btnSkip.disabled = true;
    btnNext.classList.remove("hidden");
    btnNext.focus();
  }

  function statFor(item, dir = direction) {
    return (wordStats.get(item) || {})[dir] || 0;
  }

  function recordStat(item, correct) {
    const entry = wordStats.get(item) || { fwd: 0, rev: 0 };
    const current = entry[direction] || 0;
    entry[direction] = correct ? current + 1 : Math.floor(current / 2);
    wordStats.set(item, entry);
    persistState();
  }

  function handleResult(correct) {
    if (answered) return;
    const item = currentItem();
    const answerText = answerWord(item);
    recordStat(item, correct);

    if (correct) {
      score += 1;
      feedbackEl.className = "feedback good";
      feedbackEl.innerHTML = `Goed! <b>${escapeHtml(answerText)}</b>`;
    } else {
      mistakes.push(item);
      feedbackEl.className = "feedback bad";
      feedbackEl.innerHTML = `Fout. Het juiste antwoord was: <b>${escapeHtml(answerText)}</b>`;
    }

    scoreText.textContent = `Score: ${score}`;
    markAnswered();

    if (soundMode !== "off") {
      const lang = answerLang(item);
      if (soundMode === "both" || (soundMode === "foreign" && lang !== "nl")) {
        speak(answerText, lang);
      }
    }
  }

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  btnCheck.addEventListener("click", () => {
    if (answered) return;
    const item = currentItem();
    const correct = isCorrectAnswer(answerInput.value, answerWord(item));
    handleResult(correct);
  });

  btnKnow.addEventListener("click", () => {
    handleResult(true);
  });

  btnDontKnow.addEventListener("click", () => {
    handleResult(false);
  });

  btnSkip.addEventListener("click", () => {
    if (answered) return;
    skipped += 1;
    currentIndex += 1;
    if (currentIndex >= playlist.length) {
      showEndScreen();
    } else {
      showCurrentItem();
    }
  });

  answerInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !answered) {
      e.preventDefault();
      btnCheck.click();
    }
  });

  btnNext.addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
      e.preventDefault();
      btnNext.click();
    }
  });

  btnNext.addEventListener("click", () => {
    currentIndex += 1;
    if (currentIndex >= playlist.length) {
      showEndScreen();
    } else {
      showCurrentItem();
    }
  });

  // ---------- End screen ----------
  function showEndScreen() {
    screenQuiz.classList.add("hidden");
    screenEnd.classList.remove("hidden");
    answersRevealed = false;

    const answeredTotal = score + mistakes.length;
    finalScoreEl.textContent = skipped > 0
      ? `Score: ${score} / ${answeredTotal} (${skipped} overgeslagen)`
      : `Score: ${score} / ${answeredTotal}`;
    btnPracticeMistakes.disabled = mistakes.length === 0;

    const prevLastRound = normalizeLastRound(storedMeta.lastRound);
    persistState({
      lastRound: { ...prevLastRound, [direction]: { score, total: answeredTotal, skipped, at: Date.now() } },
    });

    renderHistogram();
    renderMistakes();
  }

  const HISTOGRAM_COLORS = [
    "var(--bad)",
    "hsl(147, 55%, 88%)",
    "hsl(147, 55%, 74%)",
    "hsl(147, 55%, 60%)",
    "hsl(147, 60%, 46%)",
    "var(--good)",
    "hsl(147, 70%, 24%)",
  ];
  const HISTOGRAM_LABELS = ["Fout", "1", "2", "3", "4", "5", ">5"];

  function computeHistogramBuckets() {
    const allItems = combinedWords.concat(combinedSentences);
    const mistakeSet = new Set(mistakes);
    const buckets = [0, 0, 0, 0, 0, 0, 0];
    for (const item of allItems) {
      if (mistakeSet.has(item)) {
        buckets[0] += 1;
        continue;
      }
      if (!wordStats.has(item)) continue; // nooit beantwoord (bv. alleen overgeslagen) - niet meetellen
      const streak = Math.max(statFor(item), 1);
      buckets[Math.min(streak, 6)] += 1;
    }
    return buckets;
  }

  function renderHistogram() {
    const buckets = computeHistogramBuckets();
    const max = Math.max(...buckets, 1);
    histogramEl.innerHTML = `<div class="histogram-bars">${buckets
      .map((count, i) => {
        const heightPct = (count / max) * 100;
        return `<div class="histogram-col">
          <div class="histogram-count">${count}</div>
          <div class="histogram-bar" style="height:${heightPct}%; background:${HISTOGRAM_COLORS[i]};" title="${HISTOGRAM_LABELS[i]}: ${count}"></div>
          <div class="histogram-label">${HISTOGRAM_LABELS[i]}</div>
        </div>`;
      })
      .join("")}</div>`;
  }

  // Slim oefenen: boven deze streak geldt een woord als geleerd (zelfde grens als de histogram-bucket ">5").
  const SMART_MASTERED_STREAK = 5;
  const SMART_MIN_ITEMS = 5;
  const SMART_MAX_ITEMS = 30;
  const SMART_REFRESH_SLOTS = 5; // plekken die geleerde woorden houden, ook als er veel ongeleerde woorden zijn

  function appearProbability(item) {
    return Math.max(0.5 ** statFor(item), 0.05);
  }

  function buildSmartPlaylist() {
    const allItems = combinedWords.concat(combinedSentences);
    const total = allItems.length;
    if (total === 0) return [];

    const minTarget = Math.min(SMART_MIN_ITEMS, Math.ceil(total / 2));
    const mistakeSet = new Set(mistakes);
    // Net fout beantwoord telt altijd als "nog niet geleerd", ook bij een hoge streak.
    const isMastered = (item) => !mistakeSet.has(item) && statFor(item) > SMART_MASTERED_STREAK;

    const drawnWeak = [];
    const drawnMastered = [];
    const leftover = [];

    // Vooraf shuffelen: geleerde woorden hebben allemaal dezelfde kans, dus afkappen mag niet op deckvolgorde gaan.
    for (const item of shuffle(allItems)) {
      if (mistakeSet.has(item)) continue;
      const p = appearProbability(item);
      if (Math.random() >= p) leftover.push(item);
      else if (isMastered(item)) drawnMastered.push(item);
      else drawnWeak.push(item);
    }

    // Foute woorden gaan altijd mee, ook boven het maximum.
    const chosen = new Set(mistakes);
    let weakCount = chosen.size;

    // Laagste streak eerst; gelijke streaks staan al willekeurig door de shuffle hierboven.
    drawnWeak.sort((a, b) => statFor(a) - statFor(b));

    const capacity = Math.max(0, SMART_MAX_ITEMS - chosen.size);
    const reserved = Math.min(SMART_REFRESH_SLOTS, drawnMastered.length, capacity);
    let taken = 0;
    for (const item of drawnWeak) {
      if (taken >= capacity - reserved) break;
      chosen.add(item);
      weakCount += 1;
      taken += 1;
    }

    // Nooit meer geleerde dan gekozen ongeleerde woorden, en nooit meer dan het maximum.
    const masteredRoom = Math.min(
      drawnMastered.length,
      Math.max(0, SMART_MAX_ITEMS - chosen.size),
      weakCount
    );
    for (const item of drawnMastered.slice(0, masteredRoom)) chosen.add(item);

    // Ruimte die de geleerde woorden niet gebruiken gaat terug naar de ongeleerde woorden.
    for (const item of drawnWeak.slice(taken)) {
      if (chosen.size >= SMART_MAX_ITEMS) break;
      chosen.add(item);
    }

    // Te kleine ronde: eerst ongeleerde woorden (laagste streak eerst), daarna willekeurig geleerde.
    // Alleen hier mag de verhoudingsregel wijken, namelijk als er te weinig ongeleerde woorden zijn.
    if (chosen.size < minTarget) {
      const fillWeak = [];
      const fillMastered = drawnMastered.slice(masteredRoom);
      for (const item of leftover) (isMastered(item) ? fillMastered : fillWeak).push(item);
      fillWeak.sort((a, b) => statFor(a) - statFor(b));
      for (const item of fillWeak.concat(fillMastered)) {
        if (chosen.size >= minTarget) break;
        chosen.add(item);
      }
    }

    const selected = allItems.filter((item) => chosen.has(item));
    return getOrderMode() === "original" ? selected : shuffle(selected);
  }

  function renderMistakes() {
    if (mistakes.length === 0) {
      mistakesTitle.textContent = "";
      btnToggleAnswers.classList.add("hidden");
      mistakesList.innerHTML = '<div class="no-mistakes">Alles goed! 🎉</div>';
      return;
    }

    mistakesTitle.textContent = `Fout beantwoord (${mistakes.length}):`;
    btnToggleAnswers.classList.remove("hidden");
    btnToggleAnswers.textContent = answersRevealed ? "Verberg antwoorden" : "Toon antwoorden";

    mistakesList.innerHTML = mistakes
      .map((m) => {
        const nlPart = answersRevealed
          ? `<span class="mistake-nl">${escapeHtml(m.nl)}</span>`
          : "";
        return `<div class="mistake-row"><span class="mistake-fr-wrap"><span class="mistake-cross">&#10007;</span><span class="mistake-fr">${escapeHtml(m.word)}</span></span>${nlPart}</div>`;
      })
      .join("");
  }

  btnToggleAnswers.addEventListener("click", () => {
    answersRevealed = !answersRevealed;
    renderMistakes();
  });

  btnPracticeMistakes.addEventListener("click", () => {
    if (mistakes.length === 0) return;
    startMistakesQuiz();
  });

  btnPracticeAll.addEventListener("click", () => {
    startQuiz(combinedWords, combinedSentences);
  });

  btnSmartPractice.addEventListener("click", () => {
    beginSession(buildSmartPlaylist());
  });

  function goToNewSession() {
    screenEnd.classList.add("hidden");
    screenQuiz.classList.add("hidden");
    screenStart.classList.remove("hidden");
    fileInput.value = "";
    renderFileList();
    startWarning.classList.add("hidden");
    refreshResumeBanner();
  }

  btnNewSession.addEventListener("click", goToNewSession);
  btnNewSessionQuiz.addEventListener("click", goToNewSession);

  // ---------- Vorige sessie hervatten ----------
  btnResume.addEventListener("click", () => {
    if (!pendingResume) return;
    combinedWords = pendingResume.words;
    combinedSentences = pendingResume.sentences;
    tagLegacyItemsWithSingleFile(combinedWords.concat(combinedSentences), pendingResume.fileNames);
    wordStats = rebuildWordStats(combinedWords.concat(combinedSentences), pendingResume.wordStats);

    storedMeta = { fileNames: pendingResume.fileNames, lastRound: normalizeLastRound(pendingResume.lastRound) };
    renderFileList();
    resumeBanner.classList.add("hidden");

    startQuiz(combinedWords, combinedSentences);
  });

  // "Start nieuwe sessie" reset alleen de statistieken van de huidige richting; de andere richting blijft bewaard.
  btnClearProgress.addEventListener("click", () => {
    const resumeData = pendingResume;
    const alreadyLoaded = combinedWords.length + combinedSentences.length > 0;

    if (!alreadyLoaded) {
      if (!resumeData || resumeData.words.length + resumeData.sentences.length === 0) {
        pendingResume = null;
        resumeBanner.classList.add("hidden");
        refreshResumeBanner();
        return;
      }
      combinedWords = resumeData.words;
      combinedSentences = resumeData.sentences;
      tagLegacyItemsWithSingleFile(combinedWords.concat(combinedSentences), resumeData.fileNames);
      wordStats = rebuildWordStats(combinedWords.concat(combinedSentences), resumeData.wordStats);
      storedMeta = { fileNames: resumeData.fileNames, lastRound: normalizeLastRound(resumeData.lastRound) };
      renderFileList();
    }

    direction = getDirection();
    resetCurrentDirectionStats();
    pendingResume = null;
    resumeBanner.classList.add("hidden");

    startQuiz(combinedWords, combinedSentences);
    persistState({ fileNames: storedMeta.fileNames });
  });

  // Richting wijzigen laadt de statistieken van die richting (elke richting heeft zijn eigen statistieken).
  document.querySelectorAll('input[name="direction"]').forEach((el) => {
    el.addEventListener("change", () => {
      direction = getDirection();

      if (combinedWords.length + combinedSentences.length > 0) {
        persistState();
      } else if (pendingResume) {
        pendingResume = { ...pendingResume, direction };
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(pendingResume));
        } catch (err) {
          // Opslag niet beschikbaar - negeren.
        }
      }

      refreshResumeBanner();
    });
  });

  // ---------- Init ----------
  refreshResumeBanner();
})();
</script>

</body>
</html>
